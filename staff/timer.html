<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>1st Round Paper Quiz</title>
  <style>
    @font-face {
      font-family: 'DSEG7Classic';
      src: url('assets/fonts/DSEG7Classic-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --digit-font: 'DSEG7Classic', system-ui, sans-serif;
    }

    /* ▼ ページ背景を黒に */
    body { 
      font-family: system-ui, sans-serif; 
      background:#000; 
      padding:24px; 
      color:#fff;
    }

    .wrap { 
      max-width: 90%; 
      margin: 0 auto; 
      background:#111; 
      border:1px solid #333; 
      border-radius:10px; 
      padding:20px; 
      color:#fff;
    }

    .row { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
    button { padding:8px 12px; font-size:16px; }

    /* ▼ タイマー本体（黒背景＋白文字） */
    .time {
      font-family: var(--digit-font);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 7.5vw;
      letter-spacing: 0.03em;
      text-align:center; 
      margin:18px 0;
      line-height: 1;
      background: #000;
      color: #fff;
      position: relative;
      z-index: 2;
    }

    /* ▼ 円形進捗バー（タイマーを囲う外周） */
    .progress-wrap {
      position: relative;
      width: 100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .progress-circle {
      position: absolute;
      width: 350%;   /* タイマーより少し大きく */
      height: 350%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* 反時計回りに減るように上方向を開始点にする */
    .progress-circle circle {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .status { text-align:center; min-height:1.5em; font-size:20px; }
    .warn { color:#ff5252; }
    .ok { color:#00e676; }
    .end { color:#ff1744; font-weight:bold; font-size:32px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>1st Round Paper Quiz</h2>

    <div class="row">
      <label><b>現在のパート:</b></label>
      <div id="currentPart" style="font-size:20px; font-weight:bold;">未設定</div>
    </div>

    <!-- ▼ タイマー本体＋円形進捗バー -->
    <div class="progress-wrap">
      <div class="time" id="display">00:00</div>

      <svg class="progress-circle" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" stroke="#333" stroke-width="8" fill="none" />
        <circle id="progressBar" cx="50" cy="50" r="45"
                stroke="#00e5ff" stroke-width="8" fill="none"
                stroke-linecap="round"
                stroke-dasharray="282.743"
                stroke-dashoffset="282.743" />
      </svg>
    </div>

    <br></br>
    <br></br>
    <br></br>
    <br></br>
    <div class="row" style="justify-content:center;">
      <audio id="mpA" src="assets/audio/T_U_Koto no Asamoya.mp3"></audio>
      <audio id="mpB" src="assets/audio/Keihan_U_LtdExp.mp3"></audio>
      <button id="btnA">Part A</button>
      <button id="btnB">Part B</button>
      <button id="startBtn">開始</button>
      <button id="pauseBtn" disabled>一時停止</button>
      <button id="resetBtn" disabled>リセット</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const startBtn     = document.getElementById('startBtn');
    const pauseBtn     = document.getElementById('pauseBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const display      = document.getElementById('display');
    const status       = document.getElementById('status');
    const currentPartLabel = document.getElementById('currentPart');
    const progressBar  = document.getElementById('progressBar');

    const a = 15;
    const b = 20;

    let totalSeconds = 0;
    let remaining    = 0;
    let timerId      = null;
    let running      = false;
    let currentMode = null;

    const FULL_DASH = 282.743; // 円周（r=45）

    function updateProgress() {
      if (totalSeconds > 0) {
        const ratio = remaining / totalSeconds;
        progressBar.style.strokeDashoffset = FULL_DASH * (1 - ratio);
      } else {
        progressBar.style.strokeDashoffset = FULL_DASH;
      }
    }

    function resetProgress() {
      progressBar.style.strokeDashoffset = FULL_DASH;
    }

    document.getElementById("btnA").addEventListener("click", () => {
      currentMode = "A";
      totalSeconds = a * 60;
      remaining = totalSeconds;
      updateDisplay();
      resetProgress();
      currentPartLabel.textContent = `Part A（${a}分）`;
      setStatus(`Part A: ${a} 分で設定しました。`, 'ok');
      startBtn.disabled = false;
      resetBtn.disabled = false;
      pauseBtn.disabled = true;
    });

    document.getElementById("btnB").addEventListener("click", () => {
      currentMode = "B";
      totalSeconds = b * 60;
      remaining = totalSeconds;
      updateDisplay();
      resetProgress();
      currentPartLabel.textContent = `Part B（${b}分）`;
      setStatus(`Part B: ${b} 分で設定しました。`, 'ok');
      startBtn.disabled = false;
      resetBtn.disabled = false;
      pauseBtn.disabled = true;
    });

    function format(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function setStatus(msg, cls='') {
      status.textContent = msg || '';
      status.className = 'status ' + cls;
    }

    function updateDisplay() {
      display.childNodes[0].textContent = format(remaining);
      updateProgress();
    }

    function tick() {
      if (remaining > 0) {
        remaining -= 1;
        updateDisplay();

        if (remaining === 0) {
          clearInterval(timerId);
          timerId = null;
          running = false;

          if (currentMode === "A") document.getElementById("mpA").play();
          if (currentMode === "B") document.getElementById("mpB").play();

          setStatus('Time Up!!','end');
          startBtn.disabled = false;
          pauseBtn.disabled = true;
        }
      }
    }

    function startTimer() {
      if (running) return;

      if (remaining <= 0) {
        if (totalSeconds > 0) {
          remaining = totalSeconds;
        } else {
          setStatus('まずパートを選択してください。','warn');
          return;
        }
      }

      timerId = setInterval(tick, 1000);
      running = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      setStatus('カウント中…','ok');
    }

    function pauseTimer() {
      if (!running) return;
      clearInterval(timerId);
      timerId = null;
      running = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      setStatus('一時停止中。','ok');
    }

    function resetTimer() {
      if (running) {
        clearInterval(timerId);
        timerId = null;
        running = false;
      }
      remaining = totalSeconds || 0;
      updateDisplay();
      resetProgress();
      startBtn.disabled = totalSeconds === 0;
      pauseBtn.disabled = true;
      resetBtn.disabled = totalSeconds === 0;
      setStatus(totalSeconds ? 'リセットしました。' : 'まずパートを設定してください。', totalSeconds ? 'ok' : 'warn');
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
